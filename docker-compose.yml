services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bikeflow
      POSTGRES_USER: bikeflow
      POSTGRES_PASSWORD: bikeflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bikeflow -d bikeflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bikeflow-network

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - bikeflow-network

  back:
    build: ./back
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://bikeflow:bikeflow@db:5432/bikeflow
      ALLOWED_ORIGINS: http://localhost:5173,https://bikebooking-akyr.onrender.com
      ENTRA_TENANT_ID: 619f3e30-d007-4bab-a865-fde60890ea08
      ENTRA_CLIENT_ID: 5de9919b-0835-43df-9d3d-7d5c6f9998d7
      ENTRA_ADMIN_EMAILS: lcuzin@elcia.com,jbussiere@elcia.com
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USE_TLS: 0
      SMTP_FROM: no-reply@bikeflow.local
      RESERVATION_NOTIFY_EMAIL: test@bikeflow.local
      MAINTENANCE_EMAIL: maintenance@bikeflow.local
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - bikeflow-network

  front:
    build: ./front
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_ENTRA_TENANT_ID: 619f3e30-d007-4bab-a865-fde60890ea08
      VITE_ENTRA_CLIENT_ID: 5de9919b-0835-43df-9d3d-7d5c6f9998d7
    depends_on:
      - back
    networks:
      - bikeflow-network

networks:
  bikeflow-network:
    driver: bridge

volumes:
  postgres-data:
